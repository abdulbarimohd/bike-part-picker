# docker-compose.yml — Bike PartPicker full stack
#
# Everything:            docker compose up --build
# Database only (for     docker compose up -d db
# local `npm run dev`):
#
# Secrets come from .env in this directory (see .env.example).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bikepp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-bikepp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published so the host can run `npm run dev` / `prisma migrate`
      # against the same database the containers use.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bikepp} -d ${POSTGRES_DB:-bikepp}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # `db` is the compose service name — resolvable only inside the
      # compose network, which is why the browser-facing NEXT_PUBLIC_API_URL
      # below uses localhost instead.
      DATABASE_URL: postgresql://${POSTGRES_USER:-bikepp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bikepp}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — copy .env.example to .env}
      NODE_ENV: production
      PORT: 4000
    depends_on:
      db:
        # Waits for pg_isready, not just container start — otherwise
        # `migrate deploy` in the entrypoint races Postgres booting.
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
